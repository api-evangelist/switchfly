openapi: 3.2.0
info:
  title: Switchfly Loyalty Machine to Machine (OAuth2 & Refund) API
  description: Switchfly uses **OAuth 2** for the SSO authentication required to communicate with any 3rd party API in order to perform loyalty account actions.
  version: v3.4
tags:
- name: Machine to Machine (OAuth2 & Refund)
  description: Describes authentication required (`client_credentials` OAuth 2) and refund requests performed by Switchfly application to 3rd party service to cancel redemption components.
paths:
  /admin/token:
    post:
      tags:
      - Machine to Machine (OAuth2 & Refund)
      summary: Authentication Switchfly App against 3rd party API
      operationId: ClientCredentialAdminToken
      description: 'This endpoint will be used to perform a OAuth 2 - client credentials token

        request.


        The path in this endpoint can be the same as the `/token` path the only requirement is that a different set of

        `client_id` and `client_secret` credentials are shared by the 3rd party to Switchfly as this token request will

        be triggered to perform a **machine to machine** authentication which will then allow Switchfly to perform API

        requests to a secured `/refund` endpoint.


        The generated token will be used by the `/refund` endpoint as a Bearer token.


        User


