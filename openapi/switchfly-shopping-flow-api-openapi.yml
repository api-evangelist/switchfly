      operationId: Redeem
      security:
      - bearerAuth: []
      parameters:
      - in: header
        name: UserToken
        description: Unique string token used to identify user session in case `client_credential` grant type was used for SSO.
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Redeem'
            examples:
              RedeemAirPoints:
                $ref: '#/components/examples/RedeemAirFullPoints'
              RedeemAirRoomActivityCarPointsCash:
                $ref: '#/components/examples/RedeemAirRoomActivityCarPointsAndCash'
              RedeemActivityCarMixedPointsAndCash:
                $ref: '#/components/examples/RedeemActivityCarMixedPointsAndCash'
              RedeemRoomCarNoPoints:
                $ref: '#/components/examples/RedeemRoomCarNoPoints'
              RedeemAirRoomInsurancePointsCash:
                $ref: '#/components/examples/RedeemAirRoomInsurancePointsCash'
              RedeemActivityCash:
                $ref: '#/components/examples/RedeemActivityCash'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionConfirmation'
        '400':
          description: Malformed request
        '401':
          description: Not authorized to access the resource
        '403':
          description: It is forbidden to access the channel
        default:
          description: Unexpected Error
components:
  schemas:
    RedemptionConfirmation:
      required:
      - redemptionConfirmationId
      type: object
      format: json
      properties:
        redemptionConfirmationId:
          type: string
          description: Redemption confirmation unique id, will be used on `/refund` API calls for cancellation
    Redeem:
      type: object
      format: json
      required:
      - bookingId
      - createdDate
      - travelerProfileId
      - points
      - customerCurrency
      - lang
      - firstName
      - lastName
      - country
      - email
      - phone
      - addressLine1
      - city
      - postalCode
      - metadata
      properties:
        bookingId:
          type: string
          description: Switchfly unique identifier assigned to a specific reservation or booking to track and manage it
        createdDate:
          type: string
          format: yyyy-MM-dd'T'HH:mm:ssX
          description: Date when the booking reservation was created
        travelerProfileId:
          type: string
          description: Unique Identifier for User Profile
        points:
          type: number
          description: Available points for User Profile. It is acceptable for this field to be 0 if the transaction was fully paid in cash
        customerCurrency:
          type: string
          description: Currency used for the cash display in the customer shopping flow
        lang:
          type: number
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
          - 9
          description: "Number value which shares the language used in this booking, related to langId send on Profile Response or matches the default language configured on the system:\n\n     1 - English\n     2 - French\n     3 - Spanish\n     4 - LA_Spanish\n     5 - Chinese_Simplified\n     6 - Japanese\n     7 - BR_Portuguese\n     8 - Thai\n     9 - German\n"
        firstName:
          type: string
          description: First name of the Lead traveler
        lastName:
          type: string
          description: Last name of the Lead traveler
        country:
          type: string
          format: ISO 3166 Alpha 2
          description: Two digits country code
        email:
          type: string
          description: Last name of the Lead traveler
        phone:
          type: string
          description: phone of the Lead traveler
        mobilePhone:
          type: string
          description: Sent only if present (Optional)
        addressLine1:
          type: string
          description: addressLine1 of the Lead traveler
        addressLine2:
          type: string
          description: Sent only if customer added extra address line
        city:
          type: string
          description: Traveler profile city
        state:
          type: string
          description: State Name
        postalCode:
          type: string
          description: Postal Code
        emailSubscription:
          type: boolean
          description: Indicates if the customer has opted in to receive email communications
        metadata:
          type: object
          required:
          - payments
          - products
          properties:
            payments:
              type: array
              description: Will contain only cash payment information if the booking required a topUp payment
              required: null
              items:
                type: object
                required:
                - type
                - amount
                - currency
                - pointsAmount
                properties:
                  type:
                    type: string
                    description: Type of payment description, if any payment was made with non-points, this will say Credit Card
                  amount:
                    type: number
                    description: Cash amount paid
                  currency:
                    type: string
                    description: Currency in which the CC was charged for the amount (matches customerCurrency)
                  pointsAmount:
                    type: number
                    description: This value corresponds to the amount of missing points the customer covers with this credit card payment on a partial point redemption
            products:
              type: array
              items:
                type: object
                description: Will contain all components (segments) that this booking has.Product objects will contain point allocation (points used to cover for the cost), cost of goods and tax details along with product specific details for each type of product
                required:
                - id
                - type
                - description
                - pointsAmount
                - shortfallCash
                - fullPrice
                - costOfGoods
                - tax
                - attributes
                properties:
                  id:
                    type: string
                    description: Unique identifier assigned to Product being purchased in Switchfly ecosystem
                  type:
                    type: string
                    enum:
                    - AIR
                    - CAR
                    - ACTIVITY
                    - ROOM
                    - INSURANCE
                    - FEE
                    description: The product type represented for this product section.  There will be one product node per travel segment within the given booking.
                  description:
                    type: string
                    description: Description of product
                  pointsAmount:
                    type: number
                    description: Points price of component
                  shortfallCash:
                    type: number
                    description: Shows if any cash payment was required for the product e.g if product is paid with points + cash this will describe the cash used
                  fullPrice:
                    type: number
                    description: Total Cash price of component
                  costOfGoods:
                    type: number
                    description: Managed by config
                  tax:
                    type: number
                    description: Total tax collected for this specific product in the booking.
                  attributes:
                    description: Attributes vary depending on the type of product, different properties will be send for AIR, ROOM, ACTIVITY, CAR, INSURANCE and FEE
                    oneOf:
                    - type: object
                      title: AirProduct
                      required:
                      - recordLocator
                      - isRoundTrip
                      - legs
                      - travelerCounts
                      description: AIR
                      properties:
                        recordLocator:
                          type: string
                          description: Flight ticket record locator
                        isRoundTrip:
                          type: boolean
                          description: Describes if the air product is roundtrip, which is true first leg departure airport is equal to last leg arrival airport
                        travelerCounts:
                          type: object
                          required:
                          - adults
                          - children
                          - infantsInSeat
                          - infantsInLap
                          properties:
                            adults:
                              type: number
                              description: Number of adult passengers
                            children:
                              type: number
                              description: Number of child passengers
                            infantsInSeat:
                              type: number
                              description: Number of infant in seat passengers
                            infantsInLap:
                              type: number
                              description: Number of infant in lap passengers
                        legs:
                          type: array
                          items:
                            type: object
                            required:
                            - departureAirportCode
                            - departureDate
                            - arrivalAirportCode
                            - arrivalDate
                            - flightNumbers
                            - airlineCodes
                            properties:
                              departureAirportCode:
                                type: string
                                description: Contains the start airport code for the trip
                              departureDate:
                                type: string
                                format: yyyy-MM-dd HH:mm
                                description: Contains the start date of the trip
                              arrivalAirportCode:
                                type: string
                                description: Contains the arrival airport code of the trip
                              arrivalDate:
                                type: string
                                format: yyyy-MM-dd HH:mm
                                description: Contains the arrival date of this trip,
                              flightNumbers:
                                type: array
                                description: Contains all the flight numbers of the entire trip
                                items:
                                  type: string
                              airlineCodes:
                                type: array
                                description: Contains all the airlines codes involved in the trip
                                items:
                                  type: string
                              layoverAirportCodes:
                                type: array
                                description: Contains all the airport codes from stops in this trip
                                items:
                                  type: string
                    - type: object
                      title: RoomProduct
                      description: ROOM
                      required:
                      - hotelName
                      - hotelCity
                      - hotelCountry
                      - roomDescription
                      - checkIn
                      - checkOut
                      - nights
                      - roomType
                      - occupantsCount
                      properties:
                        hotelName:
                          type: string
                          description: Name of hotel
                        hotelCity:
                          type: string
                          description: City name where the hotel is located
                        hotelCountry:
                          type: string
                          description: Country of hotel location
                        roomDescription:
                          type: string
                          description: Description of room reservation
                        checkIn:
                          type: string
                          format: yyyy-MM-dd HH:mm
                          description: Hotel reservation check in time
                        checkOut:
                          type: string
                          format: yyyy-MM-dd HH:mm
                          description: Hotel reservation checkout time
                        nights:
                          type: number
                          description: Number of nights the hotel reservation has
                        roomType:
                          type: string
                          description: Room type description
                        occupantsCount:
                          type: string
                          description: Number of guests in room(s)
                    - type: object
                      title: ActivityProduct
                      required:
                      - activityName
                      - activityDescription
                      - scheduledDate
                      - airportCode
                      - tourDuration
                      description: ACTIVITY
                      properties:
                        activityName:
                          type: string
                          description: Name of activity
                        activityDescription:
                          type: string
                          description: Description of activity details
                        scheduledDate:
                          type: string
                          format: yyyy-MM-dd HH:mm
                          description: Activity event start date
                        airportCode:
                          type: string
                          description: Closest Airport code to activity location
                        tourDuration:
                          type: string
                          description: Description of activity duration
                    - type: object
                      title: CarProduct
                      required:
                      - companyName
                      - carDescription
                      - mileage
                      - pickUpDate
                      - pickUpLocation
                      - dropOffDate
                      - dropOffLocation
                      description: CAR
                      properties:
                        companyName:
                          type: string
                          description: Car rental company name
                        carDescription:
                          type: string
                          description: SIPP car description
                          example: Standard, SUV, Automatic Transmission, Air Conditioning
                        mileage:
                          type: string
                          description: Mileage included on rental
                        pickUpDate:
                          type: string
                          format: yyyy-MM-dd HH:mm
                          description: Pick up date
                        pickUpLocation:
                          type: string
                          description: Pick up location of car can be airport location or off airport
                        dropOffDate:
                          type: string
                          format: yyyy-MM-dd HH:mm
                          description: Drop of date
                        dropOffLocation:
                          type: string
                          description: Drop off location of car can be airport location or off airport
                    - type: object
                      title: InsuranceProduct
                      required:
                      - contractName
                      - startDate
                      - endDate
                      description: INSURANCE
                      properties:
                        contractName:
                          type: string
                          description: Insurance product name
                        startDate:
                          type: string
                          format: yyyy-MM-dd HH:mm
                          description: Start date of insurance
                        endDate:
                          type: string
                          format: yyyy-MM-dd HH:mm
                          description: End date of insurance
                    - type: object
                      title: FeeProduct
                      required:
                      - contractName
                      - feeType
                      description: INSURANCE
                      properties:
                        contractName:
                          type: string
                          description: Fee product description
                        feeType:
                          type: string
                          description: Specifies the type of fee applied to the transaction or service
    TravelerProfile:
      type: object
      format: json
      required:
      - travelerProfileId
      - balancePoints
      - customerCurrency
      - langId
      - firstName
      - lastName
      - email
      - phone
      - address
      - companyCode
      properties:
        travelerProfileId:
          type: string
          description: Traveler profile unique id
        balancePoints:
          type: number
          description: Available points in customer account used to redeem products
        customerCurrency:
          type: string
          enum:
          - USD
          - AED
          - AUD
          - BBD
          - BRL
          - BSD
          - CAD
          - COP
          - CRC
          - DOP
          - EUR
          - GBP
          - GTQ
          - HNL
          - IDR
          - ILS
          - INR
          - JMD
          - JOD
          - JPY
          - MXN
          - MYR
          - NOK
          - NZD
          - PAB
          - PEN
          - PHP
          - PLN
          - SGD
          - THB
          - TTD
          - UYU
          - VND
          - XCD
          - ZAR
          description: ISO 4217 Customer desired shop currency in case of cash top up.
        langId:
          type: number
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
          - 9
          description: "Language id used to specify the preferred language for shopping flow.\n\n     1 - English\n     2 - French\n     3 - Spanish\n     4 - LA_Spanish\n     5 - Chinese_Simplified\n     6 - Japanese\n     7 - BR_Portuguese\n     8 - Thai\n     9 - German\n"
        title:
          type: string
          enum:
          - Mr
          - Mrs
          - Miss
          - Ms
          - Dr
          - Mstr
          - Rev
          - Mx
        firstName:
          type: string
          description: Traveler profile first name
        lastName:
          type: string
          description: Traveler profile last name
        email:
          type: string
          description: Traveler profile email address
        phone:
          type: string
          description: Traveler profile preferred phone number
        address:
          type: object
          required:
          - addressLine1
          - city
          - countryCode
          properties:
            addressLine1:
              type: string
              description: Traveler profile address line 1
            addressLine2:
              type: string
              description: Traveler profile address line 2
            city:
              type: string
              description: Traveler profile city
            countryCode:
              type: string
              example: US
              description: ISO 3166-1 alpha-2 (2 letter country code)
            state:
              type: string
              example:
              - CA
              - Hauts-de-Seine
              - Catalonia
              description: ISO 3166-2 state codes or Free text for province/department/prefecture/region
        companyCode:
          type: string
          description: This is a profile parameter that Switchfly uses to customize branding and enable company-specific portal reporting
