description: >-
  Switchfly is a B2B travel loyalty and commerce technology company that powers
  white-label travel booking, dynamic packaging, and points-plus-cash redemption
  for airlines, financial services loyalty programs, and HR/employee-rewards
  platforms. Its platform connects flights, hotels, cars, and activities to
  loyalty currencies with real-time pricing, business rules, markups, and 24/7
  traveler support, giving partners access to more than 400,000 travel options.
  Switchfly exposes a REST Loyalty API (v3.4, OpenAPI 3.1) for OAuth2 SSO
  authentication, traveler-profile retrieval, points redemption, and refunds, plus
  a family of embeddable travel-search and identity UI widgets with a JavaScript
  SDK. Headquartered in Denver, Colorado, Switchfly has operated in travel
  technology for more than twenty years.
